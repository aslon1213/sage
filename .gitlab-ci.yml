# Release pipeline for the `sage` CLI.
#
# Fires only when a tag matching v*.*.* (e.g. v0.1.0, v1.2.3-rc1) is pushed.
# Two artifacts are produced and published in parallel:
#   1. A Python wheel + sdist, uploaded to the project's GitLab PyPI Package
#      Registry. Installable via:
#        pip install sage --index-url \
#          https://<token>@<gitlab-host>/api/v4/projects/<id>/packages/pypi/simple
#   2. A Docker image built with Kaniko and pushed to Harbor, tagged with both
#      the git tag (without the leading "v") and `latest`.
# A GitLab Release object is then created that links to both artifacts.

stages:
  - build
  - publish
  - release

variables:
  PYTHON_IMAGE: python:3.11-slim
  UV_IMAGE: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  RELEASE_CLI_IMAGE: registry.gitlab.com/gitlab-org/release-cli:latest

  HARBOR_REGISTRY: ${HARBOR_REGISTRY}
  HARBOR_PROJECT: container
  IMAGE_NAME: sage
  DOCKERFILE: dockerfiles/Dockerfile

# Run on tag pushes only.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.][A-Za-z0-9.]+)?$/

# --------------- BUILD ---------------
build:wheel:
  stage: build
  image: ${UV_IMAGE}
  script:
    - uv --version
    # Strip the leading "v" so the wheel version matches PEP 440.
    - export PKG_VERSION="${CI_COMMIT_TAG#v}"
    # Pin the project version to the tag so the published artifact matches.
    - sed -i -E "s/^version = \".*\"/version = \"${PKG_VERSION}\"/" pyproject.toml
    - uv build --sdist --wheel --out-dir dist
    - ls -la dist/
  artifacts:
    name: "sage-${CI_COMMIT_TAG}"
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: 30 days

# --------------- PUBLISH: WHEEL ---------------
publish:pypi:
  stage: publish
  image: ${PYTHON_IMAGE}
  needs:
    - job: build:wheel
      artifacts: true
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: ${CI_JOB_TOKEN}
    TWINE_NON_INTERACTIVE: "1"
  before_script:
    - pip install --no-cache-dir --quiet twine
  script:
    - >-
      twine upload
      --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --verbose
      dist/*

# --------------- PUBLISH: DOCKER IMAGE ---------------
# Requires CI/CD variables HARBOR_USER and HARBOR_PASSWORD (set in project
# settings, masked/protected). Kaniko reads them from /kaniko/.docker/config.json.
publish:image:
  stage: publish
  image:
    name: ${KANIKO_IMAGE}
    entrypoint: [""]
  needs:
    - job: build:wheel
      artifacts: false
  before_script:
    - export VERSION_TAG="${CI_COMMIT_TAG#v}"
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf "%s:%s" "${HARBOR_USER}" "${HARBOR_PASSWORD}" | base64 -w0)
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${HARBOR_REGISTRY}": { "auth": "${AUTH}" }
        }
      }
      EOF
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE}"
      --destination "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${VERSION_TAG}"
      --destination "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:latest"
      --build-arg "VERSION=${VERSION_TAG}"
      --snapshot-mode=redo
      --use-new-run

# --------------- RELEASE ---------------
release:gitlab:
  stage: release
  image: ${RELEASE_CLI_IMAGE}
  needs:
    - job: publish:pypi
    - job: publish:image
    - job: build:wheel
      artifacts: true
  script:
    - echo "Creating GitLab release for ${CI_COMMIT_TAG}"
  release:
    name: "sage ${CI_COMMIT_TAG}"
    tag_name: ${CI_COMMIT_TAG}
    description: |
      ## sage ${CI_COMMIT_TAG}

      ### Artifacts
      - **Python wheel + sdist** — published to the project's
        [GitLab PyPI Package Registry](${CI_PROJECT_URL}/-/packages).
      - **Docker image** — `${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${CI_COMMIT_TAG}`
        (also tagged `latest`).

      ### Install

      From the GitLab PyPI registry:

      ```bash
      pip install sage==${CI_COMMIT_TAG#v} \
        --index-url "https://__token__:<TOKEN>@${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/pypi/simple"
      ```

      Or pull the Docker image:

      ```bash
      docker pull ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${CI_COMMIT_TAG}
      ```
    assets:
      links:
        - name: "Package Registry (PyPI)"
          url: "${CI_PROJECT_URL}/-/packages"
          link_type: package
        - name: "Docker image (Harbor)"
          url: "https://${HARBOR_REGISTRY}/harbor/projects"
          link_type: image
        - name: "Source (tag)"
          url: "${CI_PROJECT_URL}/-/tree/${CI_COMMIT_TAG}"
          link_type: other
