# Release workflow for the `sage` CLI.
#
# Fires only when a tag matching v*.*.* (e.g. v0.1.0, v1.2.3-rc1) is pushed
# under this directory's git history. Produces, in parallel:
#   1. A Python wheel + sdist, attached to the GitHub Release.
#   2. A Docker image built and pushed to GHCR, tagged with both the version
#      (without the leading "v") and `latest`.
# The Release is created once both artifacts are ready.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write    # required to create a GitHub Release
  packages: write    # required to push to GHCR

env:
  IMAGE_NAME: sage
  PYTHON_VERSION: "3.11"
  DOCKERFILE: dockerfiles/Dockerfile

jobs:
  # --------------- BUILD WHEEL ---------------
  build-wheel:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: derive
        run: |
          # Strip the leading "v" so the wheel version is PEP 440 compliant.
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pin pyproject version to tag
        run: |
          sed -i -E "s/^version = \".*\"/version = \"${{ steps.derive.outputs.version }}\"/" pyproject.toml

      - name: Build wheel and sdist
        run: uv build --sdist --wheel --out-dir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sage-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # --------------- BUILD + PUSH IMAGE ---------------
  build-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build-wheel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          version="${{ needs.build-wheel.outputs.version }}"
          {
            echo "image=ghcr.io/${repo_lc}/${IMAGE_NAME}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------- RELEASE ---------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wheel, build-image]
    steps:
      - name: Download wheel + sdist
        uses: actions/download-artifact@v4
        with:
          name: sage-dist
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "sage ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Automated release for `sage` ${{ github.ref_name }}.

            **Artifacts**
            - Wheel + sdist: attached below.
            - Docker image: `ghcr.io/${{ github.repository }}/sage:${{ needs.build-wheel.outputs.version }}` (also tagged `latest`).
          files: |
            dist/*.whl
            dist/*.tar.gz
